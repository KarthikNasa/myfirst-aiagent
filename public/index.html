<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Weather AI Agent</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="weather-card">

            <h1>🌤️ Weather AI Agent</h1>

            <p class="subtitle">
                Get the latest weather report for any city
            </p>

            <div class="search-box">

                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name..."
                >

                <button id="weatherButton">
                    Get Weather Report
                </button>

            </div>

            <div id="loading" class="loading hidden">
                Loading weather...
            </div>

            <div id="error" class="error hidden"></div>

            <div id="weatherResult" class="result hidden">

                <h2 id="location"></h2>

                <div class="weather-main">

                    <div class="temperature">
                        <span id="temperature"></span>°C
                    </div>

                    <div>
                        <p>
                            Feels like:
                            <strong>
                                <span id="feelsLike"></span>°C
                            </strong>
                        </p>

                        <p>
                            Weather:
                            <strong id="condition"></strong>
                        </p>
                    </div>

                </div>

                <div class="weather-grid">

                    <div class="weather-item">
                        💧
                        <span>Humidity</span>
                        <strong id="humidity"></strong>
                    </div>

                    <div class="weather-item">
                        💨
                        <span>Wind</span>
                        <strong id="wind"></strong>
                    </div>

                    <div class="weather-item">
                        🌧️
                        <span>Rain Probability</span>
                        <strong id="rain"></strong>
                    </div>

                    <div class="weather-item">
                        🌧️
                        <span>Precipitation</span>
                        <strong id="precipitation"></strong>
                    </div>

                    <div class="weather-item">
                        🌅
                        <span>Sunrise</span>
                        <strong id="sunrise"></strong>
                    </div>

                    <div class="weather-item">
                        🌇
                        <span>Sunset</span>
                        <strong id="sunset"></strong>
                    </div>

                </div>

                <div class="today">

                    <h3>Today's Forecast</h3>

                    <p>
                        Minimum:
                        <strong id="minTemperature"></strong>°C
                    </p>

                    <p>
                        Maximum:
                        <strong id="maxTemperature"></strong>°C
                    </p>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
